<!doctype html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08070F" />
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="Ойын әлемі — қиял мен жаңа мүмкіндіктер тоғысқан интерактивті әлем."
    />
    <title>Ойын әлемі — Өз ойын әлеміңді аш</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Негізгі мазмұнға өту</a>
    <canvas id="universe" aria-hidden="true"></canvas>
    <div class="ambient" aria-hidden="true">
      <span class="ambient__orbit ambient__orbit--outer"></span>
      <span class="ambient__orbit ambient__orbit--inner"></span>
      <span class="ambient__glow"></span>
    </div>

    <header class="site-header">
      <a class="brand" href="#home" aria-label="Ойын әлемі — басты бет">
        <svg class="brand__mark" viewBox="0 0 36 36" fill="none" aria-hidden="true">
          <path d="M18 2 32 10v16L18 34 4 26V10L18 2Z" stroke="currentColor" />
          <path d="m18 8 8 5v10l-8 5-8-5V13l8-5Z" stroke="currentColor" />
          <path d="m4 10 14 8 14-8M18 18v16" stroke="currentColor" />
          <circle cx="18" cy="18" r="2.5" fill="currentColor" />
        </svg>
        <span>ОЙЫН ӘЛЕМІ</span>
      </a>

      <button
        class="menu-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="primary-navigation"
        aria-label="Мәзірді ашу"
      >
        <span></span><span></span>
      </button>

      <nav class="site-nav" id="primary-navigation" aria-label="Негізгі навигация">
        <ul class="site-nav__list"></ul>
      </nav>

      <a class="header-cta" href="#features" data-content="headerCta"></a>
    </header>

    <main id="main-content">
      <section class="chapter hero" id="home" aria-labelledby="hero-title">
        <div class="hero__content">
          <p class="eyebrow" data-content="hero.eyebrow"></p>
          <h1 id="hero-title" data-content="hero.title"></h1>
          <p class="hero__description" data-content="hero.description"></p>
          <div class="hero__actions">
            <a class="button button--primary" href="#features" data-content="hero.primary"></a>
            <a class="text-link" href="#about" data-content="hero.secondary"></a>
          </div>
        </div>
        <div class="scroll-cue" aria-hidden="true">
          <span>Төмен сырғыт</span>
          <span class="scroll-cue__line"></span>
        </div>
      </section>

      <section class="chapter about" id="about" aria-labelledby="about-title">
        <div class="chapter__index" aria-hidden="true">I</div>
        <div class="about__content measure">
          <p class="eyebrow" data-content="about.eyebrow"></p>
          <h2 id="about-title" data-content="about.title"></h2>
          <p class="section-description" data-content="about.description"></p>
        </div>
      </section>

      <div id="features">
        <section class="chapter feature feature--explore" aria-labelledby="feature-title-1" data-feature="0">
          <div class="feature__number" data-feature-number aria-hidden="true"></div>
          <div class="feature__content measure">
            <h2 id="feature-title-1" data-feature-title></h2>
            <p class="section-description" data-feature-description></p>
          </div>
        </section>

        <section class="chapter feature feature--path" aria-labelledby="feature-title-2" data-feature="1">
          <div class="feature__number" data-feature-number aria-hidden="true"></div>
          <div class="feature__content measure">
            <h2 id="feature-title-2" data-feature-title></h2>
            <p class="section-description" data-feature-description></p>
          </div>
        </section>

        <section class="chapter feature feature--possibilities" aria-labelledby="feature-title-3" data-feature="2">
          <div class="feature__number" data-feature-number aria-hidden="true"></div>
          <div class="feature__content measure">
            <h2 id="feature-title-3" data-feature-title></h2>
            <p class="section-description" data-feature-description></p>
          </div>
        </section>
      </div>

      <section class="chapter closing" aria-labelledby="closing-title">
        <div class="closing__content">
          <p class="eyebrow">КЕЛЕСІ ҚАДАМ</p>
          <h2 id="closing-title" data-content="footer.phrase"></h2>
          <a class="button button--primary" href="#features" data-content="headerCta"></a>
        </div>
      </section>
    </main>

    <footer class="site-footer" id="contact">
      <a class="brand brand--footer" href="#home">
        <svg class="brand__mark" viewBox="0 0 36 36" fill="none" aria-hidden="true">
          <path d="M18 2 32 10v16L18 34 4 26V10L18 2Z" stroke="currentColor" />
          <path d="m18 8 8 5v10l-8 5-8-5V13l8-5Z" stroke="currentColor" />
          <path d="m4 10 14 8 14-8M18 18v16" stroke="currentColor" />
          <circle cx="18" cy="18" r="2.5" fill="currentColor" />
        </svg>
        <span>ОЙЫН ӘЛЕМІ</span>
      </a>
      <div class="socials" aria-label="Әлеуметтік желілер">
        <button type="button" disabled>Instagram</button>
        <button type="button" disabled>TikTok</button>
        <button type="button" disabled>YouTube</button>
      </div>
      <p class="copyright" data-content="footer.copyright"></p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
